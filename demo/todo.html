<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font:18px system-ui;margin:0;color:#1c2742;background:#eaf2ff}main{padding:35px 27px}.logo{font-size:17px;color:#1740aa;font-weight:800}.stage{font-size:16px;letter-spacing:.06em;color:#385da0;margin:18px 0}.card{background:white;padding:25px;border-radius:22px;box-shadow:0 12px 25px #1f408822}.top{font-size:30px;font-weight:800}p{color:#52607b}input{padding:14px;border:1px solid #d5ddec;border-radius:10px;font-size:18px;width:85%}button{background:#284edc;color:white;padding:14px 18px;border:0;border-radius:10px;font-size:18px;font-weight:bold;margin-top:10px}.item{padding:14px;background:#eff3fc;border-radius:10px;margin-top:12px}.good{background:#d8f6e6;color:#17643f;padding:12px;border-radius:10px;font-weight:bold}small{color:#506682}</style>
<body><main><div class="logo">DAYMARK / MOBILE TASKS</div><div class="stage" id="stage">STAGE 1 / TASK LIST</div><section class="card"><div class="top">Daily Tasks</div><p>Make today feel manageable</p><input id="task" aria-label="New task" placeholder="New task"><button id="add">Add task</button><div id="status" class="item">No tasks yet</div><button id="done" style="display:none">Complete task</button><div id="filter" style="display:none"><button id="show">Show completed</button></div></section><p id="footer">Plan the day</p></main>
<script>let tasks=[];document.getElementById('add').onclick=()=>{const value=document.getElementById('task').value;if(!value)return;tasks.push(value);document.getElementById('stage').textContent='STAGE 2 / TASK ADDED';document.getElementById('status').textContent=value+' / active';document.getElementById('footer').textContent='Task added successfully';document.getElementById('done').style.display='block';};document.getElementById('done').onclick=()=>{document.getElementById('stage').textContent='STAGE 3 / TASK COMPLETE';document.getElementById('status').textContent=tasks[0]+' / completed';document.getElementById('footer').textContent='Completed successfully';document.getElementById('done').style.display='none';document.getElementById('filter').style.display='block';};document.getElementById('show').onclick=()=>{document.getElementById('stage').textContent='STAGE 4 / COMPLETED FILTER';document.getElementById('status').innerHTML='<div class="good">Completed: '+tasks[0]+'</div>';document.getElementById('footer').textContent='Completed filter active';};</script>
</body></html>
