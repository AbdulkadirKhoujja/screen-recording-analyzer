<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font:18px system-ui;margin:0;color:#1a3043;background:#e8f8f5}main{padding:35px 27px}.logo{font-size:17px;color:#0f7668;font-weight:800}.stage{font-size:16px;letter-spacing:.06em;color:#127a6a;margin:18px 0}.card{background:white;padding:25px;border-radius:22px;box-shadow:0 12px 28px #177e7125}.top{font-size:30px;font-weight:800}p{color:#4a6770}input{padding:14px;border:1px solid #b9d6d2;border-radius:10px;font-size:18px;width:85%}button{background:#0f8874;color:white;padding:14px;border:0;border-radius:10px;font-size:18px;font-weight:700;margin-top:15px}.result{padding:18px;background:#e1f5ec;border-radius:12px;margin-top:20px;font-size:22px;font-weight:700}</style>
<body><main><div class="logo">TIPMATE / TIP ESTIMATOR</div><div class="stage" id="stage">STAGE 1 / BILL ENTRY</div><section class="card"><div class="top">Tip Calculator</div><p>Split every bill clearly</p><input id="bill" aria-label="Bill amount" placeholder="Bill amount"><button id="tip">Choose 20 percent</button><button id="calc">Calculate total</button><div class="result" id="result">No calculation yet</div></section><p id="footer">Enter a bill amount</p></main>
<script>let percent=0;document.getElementById('tip').onclick=()=>{percent=.2;document.getElementById('stage').textContent='STAGE 2 / TIP SELECTED';document.getElementById('result').textContent='20 percent tip selected';document.getElementById('footer').textContent='Ready to calculate';};document.getElementById('calc').onclick=()=>{document.getElementById('stage').textContent='STAGE 3 / LOADING';document.getElementById('result').textContent='Processing... result pending';document.getElementById('footer').textContent='Please wait for result';setTimeout(()=>{const amount=Number(document.getElementById('bill').value);document.getElementById('stage').textContent='STAGE 4 / TOTAL RESULT';document.getElementById('result').textContent='TOTAL: $'+(amount*(1+percent)).toFixed(2);document.getElementById('footer').textContent='Calculation complete';},2200);};</script>
</body></html>
