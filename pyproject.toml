[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "screen-recording-analyzer"
version = "0.2.3"
description = "Evidence-grounded screen recording analysis with offline OCR and opt-in Gemini adapter"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Portfolio demonstration"}]
dependencies = ["opencv-python-headless>=4.8", "pydantic>=2.6", "pytesseract>=0.3.10"]

[project.optional-dependencies]
live = ["google-genai>=1.0"]
demo = ["playwright>=1.40", "Pillow>=10"]
test = ["pytest>=8"]

[project.scripts]
analyze = "screen_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
